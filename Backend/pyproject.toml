[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer-backend"
version = "0.1.0"
description = "AI Interviewer / placement preparation platform - M16 Counselor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel==0.0.22",
    "uvicorn[standard]>=0.30",
    # Shared platform foundation, PINNED BY TAG like every module.
    "ai-core @ git+https://github.com/MNEMOS-PREP/Platform_Core@v0.42.0#subdirectory=python",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["backend_*"]
namespaces = false

[tool.setuptools.package-data]
backend_M16_Counselor = ["counselors.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/router.py" = ["B008"]
"**/access.py" = ["B008"]
# Fixtures are data: a report reads best as it came.
"**/tests/*.py" = ["E501"]
# The model prompt: prose a model reads, wrapped where a sentence ends.
"**/script.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend_M16_Counselor"]
